[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blendfleet"
version = "0.2.0"
description = "Heterogeneous distributed Blender render farm for ephemeral Google Colab, Kaggle, and local GPUs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Brixton Pham" }
]
keywords = ["blender", "render-farm", "google-colab", "gpu", "cycles", "eevee", "distributed", "optix", "metal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = []

[project.optional-dependencies]
colab = ["google-colab-cli>=0.8.0; python_version >= '3.12'"]
mcp = ["websockets>=13.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
blendfleet = "blendfleet.cli:main"

[project.urls]
Homepage = "https://github.com/brixtonpham/blendfleet"
Repository = "https://github.com/brixtonpham/blendfleet"
Issues = "https://github.com/brixtonpham/blendfleet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/blendfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/blendfleet/blender_worker.py" = ["E402"]
